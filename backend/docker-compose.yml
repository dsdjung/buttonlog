version: '3.8'

services:
  db:
    image: postgres:15
    container_name: buttonlog_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: buttonlog_dev
    ports:
      - "15442:5432"
    volumes:
      - buttonlog_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  buttonlog_postgres_data:
