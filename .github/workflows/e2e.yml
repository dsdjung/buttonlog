name: E2E Tests

on:
  # Run on pushes to main/master
  push:
    branches: [main, master]

  # Run on PRs
  pull_request:
    branches: [main, master]

  # Manual trigger with environment selection
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  e2e-tests:
    name: E2E Tests (${{ github.event.inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TEST_ENV: ${{ github.event.inputs.environment || 'staging' }}
      STAGING_URL: ${{ vars.STAGING_URL || 'https://staging.buttonlog.com' }}
      PROD_URL: ${{ vars.PROD_URL || 'https://buttonlog.com' }}
      TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: e2e
        run: npx playwright install --with-deps

      - name: Run E2E tests
        working-directory: e2e
        run: npm run test:${{ env.TEST_ENV }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ env.TEST_ENV }}
          path: e2e/playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots-${{ env.TEST_ENV }}
          path: e2e/test-results/
          retention-days: 7

  # Scheduled smoke tests against production
  smoke-tests:
    name: Production Smoke Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 15

    env:
      TEST_ENV: production
      PROD_URL: ${{ vars.PROD_URL || 'https://buttonlog.com' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: e2e
        run: npx playwright install chromium

      - name: Run smoke tests
        working-directory: e2e
        run: npx playwright test --project=chromium tests/subscription.spec.ts tests/account.spec.ts

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Production smoke tests failed!"
          # Add Slack/Discord notification here if needed
