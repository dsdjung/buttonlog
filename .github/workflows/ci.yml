name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "27"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buttonlog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('backend/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        working-directory: backend
        run: mix deps.get

      - name: Check formatting
        working-directory: backend
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        working-directory: backend
        run: mix compile --warnings-as-errors

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost:5432/buttonlog_test
        run: mix test

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/assets/package-lock.json

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-mix-prod-${{ hashFiles('backend/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-prod-

      - name: Install Elixir dependencies
        working-directory: backend
        env:
          MIX_ENV: prod
        run: mix deps.get --only prod

      - name: Install Node dependencies
        working-directory: backend/assets
        run: npm ci

      - name: Build assets
        working-directory: backend/assets
        run: npm run deploy

      - name: Digest assets
        working-directory: backend
        env:
          MIX_ENV: prod
        run: mix phx.digest

      - name: Compile
        working-directory: backend
        env:
          MIX_ENV: prod
        run: mix compile

      - name: Build release
        working-directory: backend
        env:
          MIX_ENV: prod
        run: mix release

      - name: Create release tarball
        run: |
          VERSION=$(git describe --tags --always)
          tar -czf buttonlog-${VERSION}.tar.gz -C backend/_build/prod/rel buttonlog
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: buttonlog-${{ env.VERSION }}
          path: buttonlog-*.tar.gz
          retention-days: 30

