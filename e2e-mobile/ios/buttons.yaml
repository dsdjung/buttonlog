appId: com.buttonlog.app
---

# Launch the app
- launchApp
# iOS Buttons Flow Test
# Requires: User must be logged in (pre-authenticated state)

# Wait for home screen to load
- waitForAnimationToEnd

# Verify we're on the Buttons tab
- assertVisible: "Buttons"

# Check for button list or empty state
- assertVisible:
    text: ".*"
    enabled: true

# Test create button flow (tap the floating + button)
- tapOn:
    text: "+"
    optional: true

- waitForAnimationToEnd

# If create button form opened, verify fields
- assertVisible:
    text: "Name"
    optional: true

# Cancel/close the create form
- tapOn:
    text: "Cancel"
    optional: true

# Verify back on buttons screen
- waitForAnimationToEnd
